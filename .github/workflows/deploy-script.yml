# Deploys script/Code.gs to the Google Apps Script project and updates the EXISTING web app
# deployment (same /exec address, so nobody's links change). Runs when script/Code.gs changes,
# or by hand from the Actions tab.
#
# Needs one repository secret (Settings → Secrets and variables → Actions):
#   CLASPRC_JSON   – contents of ~/.clasprc.json after `npx @google/clasp@2.4.2 login`
# The Script ID and Deployment ID below aren't secret (they only identify the project).
name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths: ['script/Code.gs']
  workflow_dispatch:

concurrency:
  group: deploy-script
  cancel-in-progress: false

env:
  SCRIPT_ID: 1SvoZya6yZ73hSWLN_MBFlJBuhl7QAunyEufQLE9R9BhkDEhmGCxp3inH
  DEPLOYMENT_ID: AKfycbw54IZPu4-WfUSSYBj261c5HlHQHMpFAVHSgVTxl2IVTJ2hCc8PDG3uQPl1Vzh28E2YzQ

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check setup
        id: check
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$SCRIPT_ID" ] || [ -z "$DEPLOYMENT_ID" ]; then
            echo "Secrets not set up yet; skipping deploy."
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.check.outputs.ready == 'yes'
        with:
          node-version: 22

      - name: Deploy
        if: steps.check.outputs.ready == 'yes'
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          npm install -g @google/clasp@2.4.2 >/dev/null
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          VERSION=$(grep -oP "SCRIPT_VERSION = '\K[0-9.]+(?=')" script/Code.gs | head -1)
          echo "Deploying version $VERSION"

          # Pull the live project so the manifest (web app settings) and Index.html stay exactly as they are,
          # then swap in the new Code.gs only.
          mkdir work && cd work
          printf '{"scriptId":"%s","rootDir":"."}' "$SCRIPT_ID" > .clasp.json
          clasp pull
          ls -la
          rm -f Code.js Code.gs
          cp ../script/Code.gs Code.js
          clasp push --force
          clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "$VERSION"
          echo "Live: version $VERSION"

      - name: Clean up credentials
        if: always()
        run: rm -f "$HOME/.clasprc.json"
